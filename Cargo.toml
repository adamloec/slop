[workspace]
resolver = "3"
# Examples are workspace members rather than per-crate `examples/` files: they
# are runnable applications that own `main()`, which is exactly what DESIGN.md
# §1.2 principle 4 says a game does. WASM guest modules will NOT live here —
# they build for wasm32-wasip2 and get their own workspace (CONVENTIONS.md §1).
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adamloec/slop"

[workspace.dependencies]
# Internal crates. External dependencies are added with `cargo add` at the point
# of first use so that recorded versions are real rather than guessed, then
# hoisted here so every crate resolves to one version.
slop-app = { path = "crates/slop-app" }
slop-asset = { path = "crates/slop-asset" }
slop-core = { path = "crates/slop-core" }
slop-ecs = { path = "crates/slop-ecs" }
slop-math = { path = "crates/slop-math" }
slop-reflect = { path = "crates/slop-reflect" }
slop-reflect-derive = { path = "crates/slop-reflect-derive" }
slop-rhi = { path = "crates/slop-rhi" }
slop-verify = { path = "crates/slop-verify" }

# Structured logging. Crates depend on the `tracing` facade only; installing a
# subscriber is an application concern, which is why `tracing-subscriber` is
# behind slop-core's optional `subscriber` feature rather than always present.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Linear algebra. The feature set is a determinism decision, not a performance
# one — DESIGN.md §2.14 settles which tier we buy, and this is what it costs.
#
# `libm` routes sin, cos, atan2, exp and friends through the Rust `libm` crate
# instead of the platform's C library. The Windows CRT and glibc disagree in the
# last bit on transcendentals, so without this the same build produces different
# simulation results on the two platforms — which would make §2.13's
# cross-platform golden images fail for a reason that is not a bug. It takes
# precedence over `std` when both are enabled, which is the case here.
#
# `scalar-math` is deliberately NOT enabled. glam selects its SIMD path at
# compile time rather than by runtime CPU detection, so one build is one code
# path and results are already stable across machines of the same architecture.
# Scalar math would only buy cross-architecture agreement, which §2.14 puts out
# of scope.
glam = { version = "0.33.2", features = ["libm"] }

# The same portable maths glam is configured to use, for loose `f32` work.
# slop-math re-exports it as `scalar`; `clippy.toml` disallows the `std`
# equivalents so the two cannot drift.
libm = "0.2.16"

# Vulkan bindings. A thin FFI layer, not an abstraction — DESIGN.md §3.2.
# `ash` 0.38 targets Vulkan 1.3, which is the API version slop-rhi requires.
ash = "0.38.0"

# GPU memory suballocation. Vulkan caps `vkAllocateMemory` calls at around 4096
# on desktop drivers, so one allocation per resource is not a viable model at
# any real asset count — DESIGN.md §2.2's transient resource aliasing needs
# suballocation regardless. Default features are off because they pull in D3D12
# and Metal backends this engine will never use.
gpu-allocator = { version = "0.28.0", default-features = false, features = [
    "std",
    "vulkan",
] }

# Work-stealing thread pool, behind `slop-core`'s `JobSystem` seam and named
# nowhere else. DESIGN.md §2.5 calls the scheduler foundational, and a persistent
# pool supporting scoped borrows needs one lifetime erasure that has no safe
# formulation. Its correctness argument — every scoped task finishes before the
# scope returns, including on panic — is the kind whose failures ordinary tests
# do not catch, so the well-trodden implementation is worth more than the owned
# one. A judgement, not a rule; `jobs.rs` gives the full reasoning and the costs.
#
# The containment rule matters more than the version: no `rayon` type appears in
# any public signature, so replacing it later — for fibers, or for priority
# lanes, the two things it forecloses — is one file.
rayon = "1.12.0"

# Error enums for library crates. `anyhow` is for application boundaries only,
# per CONVENTIONS.md §6.
thiserror = "2.0.19"

# Windowing. `winit` is the OS window and input layer; `ash-window` and
# `raw-window-handle` are how a Vulkan surface is created without hand-rolling
# platform surface code, per DESIGN.md §2.13's trap table.
#
# Note the split: only slop-app depends on `winit`. slop-rhi depends on
# `raw-window-handle` alone, so it stays windowing-system agnostic and the
# headless path never pulls in a window library.
winit = "0.30.13"
ash-window = "0.13.0"
raw-window-handle = "0.6.2"

# Tooling. `anyhow` is permitted only in application crates per CONVENTIONS.md
# §6, which slop-cli is. `blake3` keys the content-hash cook cache (DESIGN.md
# §2.8) and will serve every asset type, not just shaders.
clap = { version = "4.6.5", features = ["derive"] }
anyhow = "1.0.104"
blake3 = "1.8.5"

# glTF import, for `slop-cli` only — the engine loads cooked meshes and parses no
# source format (DESIGN.md §2.8). Default features are off because most of them
# are material extensions the importer does not read yet; `utils` supplies the
# accessor readers that turn sparse and strided buffer views into iterators,
# which is the fiddly part and exactly the sort of solved problem §1.2 principle 1
# permits taking.
gltf = { version = "1.4.1", default-features = false, features = [
    "utils",
    "import",
    "names",
] }

# Golden-image encoding for DESIGN.md §5. Pure Rust deliberately: a C library
# here would add exactly the MSVC-versus-GCC build surface §2.13's trap table
# warns about, to a crate whose entire job is making cross-platform differences
# visible.
png = "0.18.1"

# Proc-macro machinery, for `slop-reflect-derive` only. A proc macro must live in
# its own crate — a Rust restriction, not a design choice — which is why
# DESIGN.md §4's crate list gains a sibling it does not mention.
#
# `syn` without default features and with only what the derive parses: it is one
# of the heaviest compile-time dependencies in the ecosystem, and the full
# feature set exists for macros that parse expressions and function bodies. This
# one reads struct definitions.
syn = { version = "3.0.3", default-features = false, features = [
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# PLAN.md §7 confines `unsafe` to slop-rhi and the allocator; where it does
# appear, the unsafe block must be explicit rather than inherited from the fn.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Mechanically enforces PLAN.md §7's "every unsafe block carries a // SAFETY:
# comment" convention, rather than relying on review to catch omissions.
undocumented_unsafe_blocks = "warn"

[profile.dev]
# Engine code is unusable at opt-level 0 well before M0 ends; dependencies are
# optimized while our own crates stay debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
