[package]
name = "slop-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# No `egui`, no `slop-ecs`, no `slop-reflect`, no `slop-render`. Every game
# depends on this crate, so anything it links, every game links -- the interface
# code that needed those is `slop-editor`'s. See the crate docs.
#
# `subscriber` is enabled here rather than in slop-core: this is the application
# layer, and installing a process-wide subscriber is an application's decision.
slop-core = { workspace = true, features = ["subscriber"] }
slop-math = { workspace = true }
slop-rhi = { workspace = true }
thiserror.workspace = true
winit = { workspace = true }

[lints]
workspace = true
