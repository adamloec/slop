[package]
name = "slop-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
# Pulls in a subscriber implementation and enables `diagnostics::init`.
# Off by default: emitting spans and events is a library's job, installing a
# subscriber is the application's, and every crate in the graph would otherwise
# pay the compile cost of a subscriber it never installs.
subscriber = ["dep:tracing-subscriber"]

[lints]
workspace = true
