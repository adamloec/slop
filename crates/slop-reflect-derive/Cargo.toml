[package]
name = "slop-reflect-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A proc macro must live in its own crate. A Rust restriction, not a design
# choice — nothing else belongs here, and consumers depend on `slop-reflect`
# rather than on this directly.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true
