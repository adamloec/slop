[package]
name = "slop-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck.workspace = true
# No `egui`. The overlay that needed it is `slop-editor`'s, which is what keeps
# this crate free of any opinion about UI toolkits.
slop-asset = { workspace = true }
slop-core = { workspace = true }
slop-math = { workspace = true }
slop-rhi = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
# Test-only: the graph's compute passes are exercised against a real device,
# using the cooked shaders in `shaders/tests/`. Deriving the barriers is only a
# claim if something dispatches through them and reads the answer back.
slop-core = { workspace = true, features = ["subscriber"] }

[lints]
workspace = true
