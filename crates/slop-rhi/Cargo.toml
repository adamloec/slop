[package]
name = "slop-rhi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ash = { workspace = true }
# Deliberately not `winit`: the RHI takes raw window handles, so it stays
# agnostic to the windowing system and the headless path pulls in nothing.
ash-window = { workspace = true }
gpu-allocator = { workspace = true }
raw-window-handle = { workspace = true }
slop-core = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
ash.workspace = true
# Test-only: push-constant blocks in the compute test. `#[derive(Pod)]` refuses
# to compile a struct with padding, which is the check a hand-rolled byte cast
# does not have — see the workspace manifest's entry for why that matters.
bytemuck = { workspace = true }
# Test-only: the golden and shader tests load cooked SPIR-V. The RHI itself
# takes bytes and knows nothing about where assets live.
slop-asset = { workspace = true }
slop-core = { workspace = true, features = ["subscriber"] }
# Golden images. A dev-dependency deliberately: verification is a test concern,
# and nothing it pulls in reaches a shipped game.
slop-verify = { workspace = true }
