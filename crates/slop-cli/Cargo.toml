[package]
name = "slop-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "slop"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# The cooking itself. This crate is the command-line front end over it; the
# editor will be another front end over the same library.
slop-cook = { workspace = true }
slop-core = { workspace = true, features = ["subscriber"] }

[lints]
workspace = true
