[package]
name = "example-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A library as well as a binary, for the same reason `example-cube` is one: the
# windowed viewer and the headless golden test must frame the model with the same
# camera, or "the test passes" and "the window looks right" quietly stop being
# the same claim.
[lib]
name = "example_model"
path = "src/lib.rs"

[[bin]]
name = "example-model"
path = "src/main.rs"

[dependencies]
slop-app = { workspace = true }
slop-asset = { workspace = true }
slop-core = { workspace = true, features = ["subscriber"] }
slop-ecs = { workspace = true }
slop-editor = { workspace = true }
slop-math = { workspace = true }
slop-reflect = { workspace = true }
slop-render = { workspace = true }
slop-rhi = { workspace = true }

[dev-dependencies]
# Golden images. A dev-dependency deliberately: verification is a test concern,
# and nothing it pulls in reaches a shipped game.
slop-verify = { workspace = true }

[lints]
workspace = true
